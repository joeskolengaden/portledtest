<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="900" height="320" fill="#ffffff"/>
  <text x="20" y="28" font-size="13" font-weight="700" fill="#0f172a">What one "step" actually lights up on the wire</text>
  <text x="20" y="46" font-size="10.5" fill="#64748b">Example port: 2 null nodes, then 6 real pixels, colour order RGB (3 channels each)</text>

  <!-- channel strip -->
  <g font-size="9" text-anchor="middle">
    <!-- null nodes (2 pixels, dim) -->
    <rect x="40" y="90" width="60" height="40" rx="4" fill="#e5e7eb" stroke="#cbd5e1"/>
    <text x="70" y="114" fill="#94a3b8">null</text>
    <rect x="104" y="90" width="60" height="40" rx="4" fill="#e5e7eb" stroke="#cbd5e1"/>
    <text x="134" y="114" fill="#94a3b8">null</text>

    <!-- real pixels 1-6 -->
    <rect x="168" y="90" width="60" height="40" rx="4" fill="#dbeafe" stroke="#93c5fd" stroke-width="2.5"/>
    <text x="198" y="114" fill="#1d4ed8" font-weight="700">pixel 1</text>
    <rect x="232" y="90" width="60" height="40" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="262" y="114" fill="#1d4ed8">pixel 2</text>
    <rect x="296" y="90" width="60" height="40" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="326" y="114" fill="#1d4ed8">pixel 3</text>
    <rect x="360" y="90" width="60" height="40" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="390" y="114" fill="#1d4ed8">pixel 4</text>
    <rect x="424" y="90" width="60" height="40" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="454" y="114" fill="#1d4ed8">pixel 5</text>
    <rect x="488" y="90" width="60" height="40" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="518" y="114" fill="#1d4ed8">pixel 6</text>
  </g>

  <!-- channel byte ticks under pixel 1 -->
  <g font-size="8" text-anchor="middle" fill="#64748b">
    <text x="178" y="145">R</text><text x="198" y="145">G</text><text x="218" y="145">B</text>
  </g>
  <path d="M168 138 H228" stroke="#93c5fd" stroke-width="1" fill="none"/>
  <text x="198" y="158" text-anchor="middle" font-size="9" fill="#1d4ed8">channelsPerPixel = 3</text>

  <!-- data start marker -->
  <path d="M168 84 V72" stroke="#1d4ed8" stroke-width="1.5" fill="none" marker-end="url(#dn)"/>
  <text x="168" y="66" text-anchor="middle" font-size="9.5" font-weight="700" fill="#1d4ed8">dataStartChannel</text>
  <text x="168" y="54" text-anchor="middle" font-size="8.5" fill="#94a3b8">(first real pixel, null nodes skipped)</text>
  <defs><marker id="dn" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto"><path d="M0 0 L8 0 L4 6 z" fill="#1d4ed8"/></marker></defs>

  <!-- step highlight -->
  <rect x="164" y="86" width="68" height="48" rx="6" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="4,3"/>
  <text x="198" y="185" text-anchor="middle" font-size="10" font-weight="700" fill="#2563eb">Step 1 fills only these 3 channels</text>
  <text x="198" y="200" text-anchor="middle" font-size="9" fill="#64748b">Step 2 slides the same 3-channel</text>
  <text x="198" y="213" text-anchor="middle" font-size="9" fill="#64748b">window to pixel 2, and so on</text>

  <!-- grouped strings note -->
  <rect x="600" y="90" width="270" height="145" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="735" y="112" text-anchor="middle" font-size="11" font-weight="700" fill="#c2410c">If the port is "grouped"</text>
  <text x="735" y="130" text-anchor="middle" font-size="9.5" fill="#9a3412">(groupCount &gt; 1 - several physical</text>
  <text x="735" y="144" text-anchor="middle" font-size="9.5" fill="#9a3412">LEDs ganged onto one channel-step)</text>
  <g>
    <rect x="625" y="156" width="46" height="24" rx="4" fill="#fed7aa" stroke="#fdba74"/>
    <text x="648" y="172" text-anchor="middle" font-size="9" fill="#9a3412">step 5</text>
    <circle cx="700" cy="168" r="7" fill="#f59e0b"/><circle cx="718" cy="168" r="7" fill="#f59e0b"/>
    <path d="M671 168 H690" stroke="#c2410c" stroke-width="1.5" fill="none" marker-end="url(#gn)"/>
  </g>
  <text x="735" y="198" text-anchor="middle" font-size="9.5" fill="#9a3412">= physical LEDs 9-10 (group of 2)</text>
  <text x="735" y="216" text-anchor="middle" font-size="9" fill="#94a3b8">the panel shows this mapping</text>
  <defs><marker id="gn" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6 z" fill="#c2410c"/></marker></defs>

  <text x="450" y="270" text-anchor="middle" font-size="10.5" fill="#64748b">This is exactly the channel math the plugin does for you - you only ever see "pixel N of M".</text>
</svg>
