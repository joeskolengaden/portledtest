<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="900" height="280" fill="#ffffff"/>
  <text x="20" y="28" font-size="13" font-weight="700" fill="#0f172a">How a click reaches a physical pixel</text>

  <!-- browser -->
  <rect x="20" y="56" width="170" height="156" rx="12" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1.5"/>
  <text x="105" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#2563eb">Your browser</text>
  <text x="105" y="102" text-anchor="middle" font-size="10.5" fill="#475569">plugin.php</text>
  <text x="105" y="122" text-anchor="middle" font-size="10.5" fill="#475569">Test / Step / Save</text>
  <text x="105" y="142" text-anchor="middle" font-size="10.5" fill="#475569">buttons you click</text>
  <text x="105" y="168" text-anchor="middle" font-size="10" fill="#94a3b8">fetch() POST</text>
  <text x="105" y="184" text-anchor="middle" font-size="10" fill="#94a3b8">action=fill / stop / …</text>

  <!-- plugin backend -->
  <rect x="255" y="56" width="190" height="156" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="350" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">This plugin</text>
  <text x="350" y="100" text-anchor="middle" font-size="10.5" fill="#475569">action.php</text>
  <text x="350" y="122" text-anchor="middle" font-size="10.5" fill="#475569">works out which raw</text>
  <text x="350" y="138" text-anchor="middle" font-size="10.5" fill="#475569">channel(s) that click</text>
  <text x="350" y="154" text-anchor="middle" font-size="10.5" fill="#475569">means for this port</text>
  <text x="350" y="180" text-anchor="middle" font-size="10" fill="#94a3b8">reads channeloutputs.json</text>
  <text x="350" y="194" text-anchor="middle" font-size="10" fill="#94a3b8">writes results.json</text>

  <!-- fppd api -->
  <rect x="510" y="56" width="190" height="156" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="605" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">fppd (stock FPP)</text>
  <text x="605" y="100" text-anchor="middle" font-size="10.5" fill="#475569">/api/testmode</text>
  <text x="605" y="122" text-anchor="middle" font-size="10.5" fill="#475569">ChannelTester</text>
  <text x="605" y="138" text-anchor="middle" font-size="10.5" fill="#475569">overlays a solid-fill</text>
  <text x="605" y="154" text-anchor="middle" font-size="10.5" fill="#475569">pattern onto those</text>
  <text x="605" y="170" text-anchor="middle" font-size="10.5" fill="#475569">exact channels</text>
  <text x="605" y="194" text-anchor="middle" font-size="10" fill="#94a3b8">present since long before 5.4</text>

  <!-- pixels -->
  <rect x="765" y="56" width="115" height="156" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="822" y="80" text-anchor="middle" font-size="12.5" font-weight="700" fill="#c2410c">Your port</text>
  <g>
    <circle cx="792" cy="112" r="7" fill="#ef4444"/><circle cx="812" cy="112" r="7" fill="#f59e0b"/>
    <circle cx="832" cy="112" r="7" fill="#22c55e"/><circle cx="852" cy="112" r="7" fill="#3b82f6"/>
    <circle cx="792" cy="134" r="7" fill="#a855f7"/><circle cx="812" cy="134" r="7" fill="#e5e7eb"/>
    <circle cx="832" cy="134" r="7" fill="#e5e7eb"/><circle cx="852" cy="134" r="7" fill="#e5e7eb"/>
  </g>
  <text x="822" y="160" text-anchor="middle" font-size="10" fill="#9a3412">lit pixel(s) =</text>
  <text x="822" y="174" text-anchor="middle" font-size="10" fill="#9a3412">visible proof</text>

  <!-- arrows main flow -->
  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a1)">
    <path d="M190 134 H245"/>
    <path d="M445 134 H500"/>
    <path d="M700 134 H755"/>
  </g>
  <defs><marker id="a1" markerWidth="9" markerHeight="9" refX="7" refY="3.2" orient="auto">
    <path d="M0 0 L7 3.2 L0 6.4 z" fill="#334155"/></marker></defs>

  <text x="450" y="244" text-anchor="middle" font-size="10.5" fill="#64748b">No fppd changes: this plugin only calls the same test-mode API the stock Testing page already uses.</text>
  <text x="450" y="262" text-anchor="middle" font-size="10.5" fill="#64748b">One test pattern is live at a time, so selecting a different port always replaces the last one - ports never overlap.</text>
</svg>
